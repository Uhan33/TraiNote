<!doctype html>
<!-- 링크 미리보기 이미지(1200×630) 원본 — scripts/gen-og-image.sh 로 public/og-image.png 생성 -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Pretendard; src: url('../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: Pretendard, sans-serif; background: #171717; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .logo { width: 88px; height: 88px; border-radius: 22px; background: #fff; position: relative; }
  .logo::before { content: ''; position: absolute; left: 22px; top: 23px; width: 44px; height: 11px; background: #171717; }
  .logo::after { content: ''; position: absolute; left: 38.5px; top: 23px; width: 11px; height: 42px; background: #171717; }
  .name { font-size: 56px; font-weight: 800; letter-spacing: -1px; }
  h1 { margin-top: 64px; font-size: 76px; font-weight: 800; line-height: 1.2; letter-spacing: -2px; }
  p { margin-top: 28px; font-size: 34px; font-weight: 500; color: #a3a3a3; }
</style>
</head>
<body>
  <div class="brand"><div class="logo"></div><span class="name">TraiNote</span></div>
  <h1>회원 운동일지,<br />카톡 말고 한 곳에.</h1>
  <p>트레이너는 기록하고, 회원은 코드 하나로 확인해요</p>
</body>
</html>
