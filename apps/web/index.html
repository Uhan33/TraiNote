<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 홈 화면: 아이콘(없으면 화면 캡쳐가 아이콘이 됨)·이름·상태 표시줄 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TraiNote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TraiNote · PT 회원 운동일지</title>
    <link rel="canonical" href="https://trainote.kr/" />
    <meta name="description" content="트레이너는 수업 중에 바로 기록하고, 회원은 가입 없이 코드 하나로 운동일지와 성장 그래프를 보고 개인운동도 남겨요." />
    <!-- 링크 미리보기 (카톡·문자·슬랙 등). 화면 주소와 관계없이 같은 카드 — 이미지는 scripts/gen-og-image.sh -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TraiNote" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://trainote.kr/" />
    <meta property="og:title" content="TraiNote · PT 회원 운동일지" />
    <meta property="og:description" content="트레이너는 수업 중에 바로 기록하고, 회원은 가입 없이 코드 하나로 운동일지와 성장 그래프를 보고 개인운동도 남겨요." />
    <meta property="og:image" content="https://trainote.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TraiNote — 회원 운동일지, 카톡 말고 한 곳에." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <!-- 로딩 화면: 앱(JS)이 뜨기 전 + 로그인 확인 중(components/Splash) — 같은 모양 -->
    <style>
      .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; color: #0a0a0a;
        font: 700 30px/1 system-ui, -apple-system, sans-serif; letter-spacing: -0.02em; }
      .dark .splash { background: #0a0a0a; color: #fafafa; }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash">TraiNote</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
